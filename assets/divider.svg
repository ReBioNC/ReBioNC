<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="8" viewBox="0 0 1200 8" role="img" aria-label="divider">
<defs>
<linearGradient id="b" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#3fb950" stop-opacity="0"/>
<stop offset=".5" stop-color="#3fb950"/>
<stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
</linearGradient>
</defs>
<style>
.s{animation:s 4s ease-in-out infinite}
@keyframes s{0%{transform:translateX(-400px)}100%{transform:translateX(1200px)}}
@media (prefers-reduced-motion:reduce){.s{animation:none;transform:translateX(400px)}}
</style>
<rect x="0" y="3.5" width="1200" height="1" fill="#8b949e" fill-opacity=".25"/>
<rect class="s" x="0" y="2.5" width="400" height="3" rx="1.5" fill="url(#b)"/>
</svg>
